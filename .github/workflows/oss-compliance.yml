name: OSS compliance

# Note on known false positives in the vendored audit scripts (they are
# warnings only, and this workflow fails only on blockers):
#   * opensource_audit.py flags its own keyword list as "sensitive terms" when
#     it scans the repository it lives in.
#   * license_metadata_audit.py does not parse OR-combined SPDX expressions and
#     warns about the valid `MIT OR Apache-2.0` in Cargo.toml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: oss-compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    name: OSS compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Required files and repository hygiene
        run: python3 .github/scripts/opensource_audit.py .

      - name: README quality
        run: python3 .github/scripts/readme_audit.py . --fail-on blocker

      - name: License and package metadata
        run: python3 .github/scripts/license_metadata_audit.py . --fail-on blocker

      - name: Workflow safety
        run: python3 .github/scripts/workflow_audit.py . --fail-on blocker

  dependency-policy:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check licenses, advisories, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
