name: Bug report
description: Something renders wrong, crashes, or behaves unexpectedly
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. A minimal reproduction makes
        fixes dramatically faster.
  - type: input
    id: version
    attributes:
      label: leafread version
      description: Output of `leafread --version`
      placeholder: "leafread 0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and terminal
      placeholder: "macOS 15, iTerm2 3.5 (or Ubuntu 24.04, GNOME Terminal, tmux 3.5)"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Interactive reader (TUI)
        - Piped to stdout (--no-tui or non-terminal output)
        - Both
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command and flags you ran
      render: shell
      placeholder: leafread --theme light README.md
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: Minimal Markdown
      description: The smallest Markdown file that reproduces the problem
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include screenshots for TUI layout issues.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I reproduced this with the latest release
          required: true
