# cargo-deny policy. See https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
yanked = "warn"
# Unmaintained-only advisories for transitive dependencies with no upgrade
# path. None of these have a known vulnerability; they are tracked here so the
# check stays meaningful instead of being turned off.
ignore = [
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust is pulled in by syntect 5.x (theme loading); no maintained version is compatible yet" },
    { id = "RUSTSEC-2024-0436", reason = "paste is pulled in by image's AVIF encoders; no replacement release exists" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is pulled in by syntect's dump format; upstream declares 1.3.3 complete" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MITNFA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `syntect` pulls in the same small utility crates at incompatible majors in a
# few places; duplicates are warnings, not blockers.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
